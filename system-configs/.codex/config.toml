# Only these top-level entries are owned by this repository. Sync merges them
# into the existing config so unowned machine-local settings survive.
model = "gpt-5.6-terra"
model_reasoning_effort = "high"
web_search = "live"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[tui]
status_line = ["thread-name", "model-with-reasoning", "current-dir", "context-used", "task-progress"]
