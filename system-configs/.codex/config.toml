# Only these top-level entries are owned by this repository. Sync merges them
# into the existing config so unowned machine-local settings survive.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
web_search = "live"
approval_policy = "never"
sandbox_mode = "danger-full-access"

[tui]
status_line = ["thread-name", "model-with-reasoning", "git-branch", "current-dir", "context-remaining", "codex-version", "context-used", "weekly-limit", "five-hour-limit", "task-progress"]
status_line_use_colors = true
theme = "executive"
